name: Release Plugin

on:
  workflow_dispatch:
    inputs:
      PLUGIN_NAME_TO_RELEASE:
        description: 'Name of the plugin to release (e.g., history-viewer, archive-explorer)'
        required: true
        type: choice
        options:
          - archive-explorer
          - engineering-wizard
          - history-viewer
          - location-manager
          - location-viewer
          - template-generator
          - tsld
      RELEASE_TYPE:
        description: 'Release type: MAJOR, MINOR, or PATCH'
        required: false
        type: choice
        options:
          - MINOR
          - MAJOR
          - PATCH
        default: 'MINOR'

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: plugin-publication
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Checkout published-plugins branch
        uses: actions/checkout@v4
        with:
          ref: published-plugins
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Node.js for release metadata
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch main and tags
        id: fetch_refs
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git fetch origin 'refs/tags/*:refs/tags/*'

      - name: Check that a new release can be published
        id: preflight
        run: |
          set -euo pipefail
          case "$PLUGIN_NAME" in
            archive-explorer|engineering-wizard|history-viewer|location-manager|location-viewer|template-generator|tsld) ;;
            *) echo "Unsupported plugin: $PLUGIN_NAME" >&2; exit 1 ;;
          esac
          case "$RELEASE_TYPE" in
            MAJOR|MINOR|PATCH) ;;
            *) echo "Unsupported release type: $RELEASE_TYPE" >&2; exit 1 ;;
          esac

          sha_file="compas/plugins/SNAPSHOT_SHA"
          if [ ! -f "$sha_file" ]; then
            echo "compas/plugins/SNAPSHOT_SHA is missing. Nothing is published." >&2
            exit 1
          fi
          snapshot_sha=$(tr -d '[:space:]' < "$sha_file")
          if ! [[ "$snapshot_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "compas/plugins/SNAPSHOT_SHA is not a commit SHA. Nothing is published." >&2
            exit 1
          fi
          if ! git cat-file -e "${snapshot_sha}^{commit}"; then
            echo "SNAPSHOT_SHA ${snapshot_sha} is not a commit. Nothing is published." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$snapshot_sha" origin/main; then
            echo "SNAPSHOT_SHA ${snapshot_sha} is not on main. Nothing is published." >&2
            exit 1
          fi

          snapshot="compas/plugins/${PLUGIN_NAME}/snapshot/index.js"
          if [ ! -f "$snapshot" ]; then
            echo "Snapshot index.js is missing at ${snapshot}. Nothing is published." >&2
            exit 1
          fi
          snapshot_pkg="compas/plugins/${PLUGIN_NAME}/snapshot/package.json"
          if [ ! -f "$snapshot_pkg" ]; then
            echo "Snapshot package.json is missing at ${snapshot_pkg}. Nothing is published." >&2
            exit 1
          fi
          node -e 'const fs=require("fs"); const pkg=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if (!pkg || typeof pkg !== "object" || Array.isArray(pkg)) throw new Error("Snapshot package.json must contain an object.");' "$snapshot_pkg"

          tags=$(git tag --points-at "$snapshot_sha")
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^${PLUGIN_NAME}-[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "${PLUGIN_NAME} is already tagged on ${snapshot_sha}: ${tag}. Nothing is published." >&2
              exit 1
            fi
          done <<< "$tags"

          for dir in "compas/plugins/${PLUGIN_NAME}"/*/; do
            [ -d "$dir" ] || continue
            version=$(basename "$dir")
            if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] && [ -f "${dir}index.js" ]; then
              if cmp -s "$snapshot" "${dir}index.js"; then
                echo "Snapshot index.js is already released as ${PLUGIN_NAME}/${version}. Nothing is published." >&2
                exit 1
              else
                status=$?
                if [ "$status" -ne 1 ]; then
                  echo "Cannot compare snapshot with ${dir}index.js." >&2
                  exit "$status"
                fi
              fi
            fi
          done

          echo "SNAPSHOT_SHA=${snapshot_sha}" >> "$GITHUB_OUTPUT"
        env:
          PLUGIN_NAME: ${{ inputs.PLUGIN_NAME_TO_RELEASE }}
          RELEASE_TYPE: ${{ inputs.RELEASE_TYPE }}

      - name: Find last release version
        id: find_last_version
        run: |
          set -euo pipefail
          versions=()
          for dir in "compas/plugins/${PLUGIN_NAME}"/*/; do
            [ -d "$dir" ] || continue
            version=$(basename "$dir")
            if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              versions+=("$version")
            fi
          done
          if [ "${#versions[@]}" -eq 0 ]; then
            last_version="0.0.0"
          else
            last_version=$(printf '%s\n' "${versions[@]}" | sort -V | tail -n 1)
          fi
          echo "LAST_RELEASE_VERSION=${last_version}" >> "$GITHUB_OUTPUT"
        env:
          PLUGIN_NAME: ${{ inputs.PLUGIN_NAME_TO_RELEASE }}

      - name: Calculate new version
        id: calculate_new_version
        run: |
          set -euo pipefail
          if ! [[ "$LAST_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Invalid version format: $LAST_VERSION. Nothing is published." >&2
            exit 1
          fi

          parse_component() {
            local digits="${1#"${1%%[!0]*}"}"
            digits="${digits:-0}"
            local value=$((10#$digits))
            if [[ "$value" != "$digits" ]]; then
              echo "Version component exceeds Bash integer range: $digits." >&2
              return 1
            fi
            printf '%s\n' "$value"
          }
          MAJOR=$(parse_component "${BASH_REMATCH[1]}")
          MINOR=$(parse_component "${BASH_REMATCH[2]}")
          PATCH=$(parse_component "${BASH_REMATCH[3]}")

          case "$RELEASE_TYPE" in
            MAJOR) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            MINOR) MINOR=$((MINOR + 1)); PATCH=0 ;;
            PATCH) PATCH=$((PATCH + 1)) ;;
            *) echo "Unsupported release type: $RELEASE_TYPE" >&2; exit 1 ;;
          esac
          new_version="${MAJOR}.${MINOR}.${PATCH}"
          if ! [[ "$new_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version increment exceeds Bash integer range. Nothing is published." >&2
            exit 1
          fi
          echo "NEW_RELEASE_VERSION=${new_version}" >> "$GITHUB_OUTPUT"
          echo "RELEASE_TAG=${PLUGIN_NAME}-${new_version}" >> "$GITHUB_OUTPUT"
        env:
          PLUGIN_NAME: ${{ inputs.PLUGIN_NAME_TO_RELEASE }}
          RELEASE_TYPE: ${{ inputs.RELEASE_TYPE }}
          LAST_VERSION: ${{ steps.find_last_version.outputs.LAST_RELEASE_VERSION }}

      - name: Ensure tag name and version folder are free
        id: ensure_available
        run: |
          set -euo pipefail
          existing_tag=$(git tag --list "$RELEASE_TAG")
          if [ -n "$existing_tag" ]; then
            echo "Tag ${RELEASE_TAG} already exists. Nothing is published." >&2
            exit 1
          fi
          release_dir="compas/plugins/${PLUGIN_NAME}/${NEW_RELEASE_VERSION}"
          if [ -e "$release_dir" ] || [ -L "$release_dir" ]; then
            echo "Version path ${release_dir} already exists. Nothing is published." >&2
            exit 1
          fi
          echo "Release ${RELEASE_TAG} at ${SNAPSHOT_SHA}"
        env:
          PLUGIN_NAME: ${{ inputs.PLUGIN_NAME_TO_RELEASE }}
          NEW_RELEASE_VERSION: ${{ steps.calculate_new_version.outputs.NEW_RELEASE_VERSION }}
          RELEASE_TAG: ${{ steps.calculate_new_version.outputs.RELEASE_TAG }}
          SNAPSHOT_SHA: ${{ steps.preflight.outputs.SNAPSHOT_SHA }}

      - name: Copy snapshot to the version folder
        id: copy_plugin
        run: |
          set -euo pipefail
          release_dir="compas/plugins/$PLUGIN_NAME/$NEW_RELEASE_VERSION"
          mkdir "$release_dir"
          cp -r "compas/plugins/$PLUGIN_NAME/snapshot/." "$release_dir/"
          node -e 'const fs=require("fs"); const file=process.argv[1]; const version=process.argv[2]; const pkg=JSON.parse(fs.readFileSync(file,"utf8")); pkg.version=version; fs.writeFileSync(file, JSON.stringify(pkg,null,2)+"\n");' "$release_dir/package.json" "$NEW_RELEASE_VERSION"
        env:
          PLUGIN_NAME: ${{ inputs.PLUGIN_NAME_TO_RELEASE }}
          NEW_RELEASE_VERSION: ${{ steps.calculate_new_version.outputs.NEW_RELEASE_VERSION }}

      - name: Commit and push the published version
        id: publish_plugin
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          release_dir="compas/plugins/$PLUGIN_NAME/$NEW_RELEASE_VERSION"
          git add -- "$release_dir"
          git commit -m "Deploy $PLUGIN_NAME version $NEW_RELEASE_VERSION to published-plugins" -- "$release_dir"
          git push origin HEAD:refs/heads/published-plugins
        env:
          PLUGIN_NAME: ${{ inputs.PLUGIN_NAME_TO_RELEASE }}
          NEW_RELEASE_VERSION: ${{ steps.calculate_new_version.outputs.NEW_RELEASE_VERSION }}

      - name: Tag the snapshot's main commit
        id: tag_plugin
        run: |
          set -euo pipefail
          git -c tag.gpgSign=false tag -a "$RELEASE_TAG" "$SNAPSHOT_SHA" -m "Release $PLUGIN_NAME $NEW_RELEASE_VERSION"
          git push origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
        env:
          PLUGIN_NAME: ${{ inputs.PLUGIN_NAME_TO_RELEASE }}
          NEW_RELEASE_VERSION: ${{ steps.calculate_new_version.outputs.NEW_RELEASE_VERSION }}
          RELEASE_TAG: ${{ steps.calculate_new_version.outputs.RELEASE_TAG }}
          SNAPSHOT_SHA: ${{ steps.preflight.outputs.SNAPSHOT_SHA }}

  deploy-pages:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
