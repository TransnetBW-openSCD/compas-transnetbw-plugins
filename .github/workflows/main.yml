name: Build and Deploy Plugins

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository (Main Branch)
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java for API generation
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Project
        run: npm run build

      - name: Run Tests
        run: npm run test:all

      - name: Test Plugin Release Workflow
        run: node --test tools/plugin-release.test.mjs

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: write
    concurrency:
      group: plugin-publication
      cancel-in-progress: false
    steps:
      - name: Checkout published-plugins Branch
        uses: actions/checkout@v4
        with:
          ref: published-plugins

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Copy Built Files to Plugins Folder
        id: copy_build
        run: |
          set -euo pipefail
          mkdir -p compas/plugins
          cp -r dist/apps/* compas/plugins

      - name: Commit and Push Changes
        id: deploy_snapshot
        run: |
          set -euo pipefail
          if ! [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "SOURCE_SHA must be the full main build commit SHA." >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- compas/plugins
          if git diff --cached --quiet -- compas/plugins ':(exclude)compas/plugins/SNAPSHOT_SHA'; then
            echo "Build output unchanged. SNAPSHOT_SHA left as-is."
          else
            status=$?
            if [ "$status" -ne 1 ]; then
              exit "$status"
            fi
            printf '%s\n' "$SOURCE_SHA" > compas/plugins/SNAPSHOT_SHA
            git add -- compas/plugins
            git commit -m "Deploy latest build to plugins" -- compas/plugins
            git push origin HEAD:refs/heads/published-plugins
          fi
        env:
          SOURCE_SHA: ${{ github.sha }}

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
